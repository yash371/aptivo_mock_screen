<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>Chat · Message to Guard · Aptivo</title>
    <link rel="stylesheet" href="common.css" />
    <script src="common.js" defer></script>
    <style>
      /* Screen-specific only — do not lift into common.css */
      .composer-area {
        background: var(--color-bg);
        box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05);
        flex-shrink: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .composer-area .composer {
        box-shadow: none;
        padding-bottom: var(--space-sm);
      }
      .attach-preview {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-md) 0;
      }
      .attach-preview .preview-item {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        padding: 6px 10px;
        background: var(--color-surface);
        border-radius: var(--radius-md);
        max-width: 100%;
        min-width: 0;
      }
      .attach-preview .preview-thumb {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        background: var(--color-surface-alt);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
        overflow: hidden;
      }
      .attach-preview .preview-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .attach-preview .preview-meta {
        min-width: 0;
        flex: 1;
      }
      .attach-preview .preview-name {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .attach-preview .preview-size {
        font-size: 11px;
        color: var(--color-text-2);
        margin-top: 1px;
      }
      .attach-preview .preview-close {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--color-surface-alt);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        line-height: 1;
        color: var(--color-text-2);
        flex-shrink: 0;
        font-family: inherit;
      }
      .attach-preview .preview-close:hover {
        background: var(--color-border);
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <!-- ============ Header ============ -->
      <header class="app-header">
        <button type="button" class="back-btn" id="backBtn" aria-label="Back">
          ←
        </button>
        <div class="header-title">
          <h1 id="guardName">Loading…</h1>
          <div class="sub" id="guardSub"></div>
        </div>
        <div class="row gap-xs" id="roleSwitch"></div>
        <button
          type="button"
          class="header-action ghost"
          id="moreBtn"
          aria-label="More actions"
          style="font-size: 20px"
        >
          ⋯
        </button>
      </header>

      <!-- ============ Status banner (resolved / closed) ============ -->
      <div id="statusBanner" class="hidden"></div>

      <!-- ============ Chat scroll ============ -->
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-list" id="chatList"></div>
      </div>

      <!-- ============ Composer ============ -->
      <div class="composer-area" id="composerArea">
        <div id="attachmentPreview" class="hidden"></div>
        <div class="composer">
          <button
            type="button"
            class="icon-btn"
            id="attachBtn"
            aria-label="Attach"
          >
            📎
          </button>
          <div class="composer-input-wrap">
            <textarea
              class="composer-input"
              id="msgInput"
              placeholder="Type a message…"
              rows="1"
              maxlength="1200"
              aria-label="Message"
            ></textarea>
            <div class="composer-meta">
              <span></span>
              <span class="char-count" id="charCount">0/1000</span>
            </div>
          </div>
          <button
            type="button"
            class="send-btn"
            id="sendBtn"
            aria-label="Send"
            disabled
          >
            ➤
          </button>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        /* =================================================
         1. Resolve conversation
         ================================================= */
        var urlConvId = getParam("id");
        if (!urlConvId) {
          navigate("list.html");
          return;
        }

        var conv = null;
        var pendingRecipient = null;
        var convId = urlConvId;

        if (urlConvId === "new") {
          var pendingRaw = sessionStorage.getItem(
            "aptivo_mg_pending_recipient",
          );
          if (!pendingRaw) {
            navigate("select-guard.html");
            return;
          }
          try {
            pendingRecipient = JSON.parse(pendingRaw);
          } catch (e) {
            navigate("select-guard.html");
            return;
          }
        } else {
          conv = Store.getConversation(urlConvId);
          if (!conv || conv.residentId !== Store.RESIDENT.id) {
            toast("Conversation not found", "error");
            setTimeout(function () {
              navigate("list.html");
            }, 800);
            return;
          }
        }

        /* =================================================
         2. DOM refs
         ================================================= */
        var chatScroll = document.getElementById("chatScroll");
        var chatList = document.getElementById("chatList");
        var guardNameEl = document.getElementById("guardName");
        var guardSubEl = document.getElementById("guardSub");
        var composerArea = document.getElementById("composerArea");
        var msgInput = document.getElementById("msgInput");
        var charCount = document.getElementById("charCount");
        var sendBtn = document.getElementById("sendBtn");
        var attachBtn = document.getElementById("attachBtn");
        var moreBtn = document.getElementById("moreBtn");
        var statusBanner = document.getElementById("statusBanner");
        var attachmentPreview = document.getElementById("attachmentPreview");
        var roleSwitchEl = document.getElementById("roleSwitch");

        /* =================================================
         3. State
         ================================================= */
        var pendingAttachment = null;
        var statusPollTimer = null;

        /* =================================================
         4. Render — header
         ================================================= */
        function renderHeader() {
          var name, sub, onDuty;
          if (conv) {
            name = conv.guardName;
            if (conv.recipientType === "all") {
              sub = "Broadcasting to on-duty guards";
              onDuty = true;
            } else {
              var g = Store.getGuard(conv.guardId);
              sub = g
                ? g.gate + " · " + (g.onDuty ? "On duty" : "Off duty")
                : "";
              onDuty = g ? g.onDuty : false;
            }
          } else {
            name = pendingRecipient.guardName;
            if (pendingRecipient.type === "all") {
              sub = "Broadcasting to on-duty guards";
              onDuty = true;
            } else {
              var pg = Store.getGuard(pendingRecipient.guardId);
              sub = pg
                ? pg.gate + " · " + (pg.onDuty ? "On duty" : "Off duty")
                : "";
              onDuty = pg ? pg.onDuty : false;
            }
          }
          guardNameEl.textContent = name;
          var dotColor = onDuty
            ? "var(--color-success)"
            : "var(--color-text-2)";
          guardSubEl.innerHTML =
            '<span style="width:6px;height:6px;border-radius:50%;background:' +
            dotColor +
            ';display:inline-block;flex-shrink:0;"></span>' +
            escapeHtml(sub);
        }

        /* =================================================
         5. Render — messages
         ================================================= */
        function renderMessages() {
          var messages = conv ? Store.getMessages(convId) : [];
          if (!messages.length) {
            chatList.innerHTML =
              '<div class="empty-state">' +
              '<div class="empty-icon">💬</div>' +
              '<h3 class="empty-title">Start the conversation</h3>' +
              '<p class="empty-desc">Send a message below to begin chatting with the guard.</p>' +
              "</div>";
            return;
          }
          chatList.innerHTML = renderChatMessages(messages, "resident");
        }

        function scrollToBottom() {
          requestAnimationFrame(function () {
            chatScroll.scrollTop = chatScroll.scrollHeight;
          });
        }

        function isNearBottom() {
          return (
            chatScroll.scrollHeight -
              chatScroll.scrollTop -
              chatScroll.clientHeight <
            60
          );
        }

        /* =================================================
         6. Render — status banner + composer visibility
         ================================================= */
        function renderBanner() {
          if (!conv || conv.status === "active") {
            statusBanner.className = "hidden";
            statusBanner.innerHTML = "";
            composerArea.classList.remove("hidden");
            return;
          }

          var isResolved = conv.status === "resolved";
          statusBanner.className =
            "status-banner " + (isResolved ? "resolved" : "closed");
          statusBanner.innerHTML =
            '<span class="banner-icon">' +
            (isResolved ? "✓" : "📁") +
            "</span>" +
            '<div class="banner-body">' +
            '<div class="banner-title">' +
            (isResolved ? "Conversation resolved" : "Conversation closed") +
            "</div>" +
            '<div class="banner-desc">' +
            (isResolved
              ? "The guard has marked this issue as resolved."
              : "This conversation has been closed by the guard.") +
            "</div>" +
            "</div>" +
            '<button type="button" class="banner-cta" id="reopenBtn">Reopen</button>';

          composerArea.classList.add("hidden");

          document
            .getElementById("reopenBtn")
            .addEventListener("click", function () {
              Confirm.show({
                title: "Reopen conversation?",
                body: "The conversation will be marked active again so you can continue messaging the guard.",
                confirmLabel: "Reopen",
                onConfirm: function () {
                  Store.reopenConversation(convId);
                  conv = Store.getConversation(convId);
                  renderAll();
                  toast("Conversation reopened", "success");
                },
              });
            });
        }

        /* =================================================
         7. Render — role-switch links
         ================================================= */
        function renderRoleSwitch() {
          var cid = convId && convId !== "new" ? convId : null;
          roleSwitchEl.innerHTML = roleLinks("resident", cid);
        }

        /* =================================================
         8. Composer state
         ================================================= */
        function updateComposerState() {
          var text = msgInput.value;
          var len = text.length;
          charCount.textContent = len + "/" + LIMITS.MESSAGE_MAX;
          charCount.classList.toggle("over", len > LIMITS.MESSAGE_MAX);

          var hasText = text.trim().length > 0;
          var hasAttach = !!pendingAttachment;
          var isValid = (hasText || hasAttach) && len <= LIMITS.MESSAGE_MAX;
          sendBtn.disabled = !isValid;
        }

        /* =================================================
         9. Attachment preview
         ================================================= */
        function renderAttachmentPreview() {
          if (!pendingAttachment) {
            attachmentPreview.innerHTML = "";
            attachmentPreview.classList.add("hidden");
            return;
          }
          attachmentPreview.classList.remove("hidden");
          var a = pendingAttachment;
          var thumb =
            a.type === "image" && a.url
              ? '<img src="' + escapeHtml(a.url) + '" alt="" />'
              : "📄";
          attachmentPreview.innerHTML =
            '<div class="attach-preview">' +
            '<div class="preview-item">' +
            '<div class="preview-thumb">' +
            thumb +
            "</div>" +
            '<div class="preview-meta">' +
            '<div class="preview-name">' +
            escapeHtml(a.name) +
            "</div>" +
            '<div class="preview-size">' +
            escapeHtml(a.size) +
            "</div>" +
            "</div>" +
            '<button type="button" class="preview-close" id="removeAttach" aria-label="Remove attachment">×</button>' +
            "</div>" +
            "</div>";
          document
            .getElementById("removeAttach")
            .addEventListener("click", function () {
              pendingAttachment = null;
              renderAttachmentPreview();
              updateComposerState();
            });
        }

        /* =================================================
         10. Attachment picker
         ================================================= */
        function openAttachSheet() {
          Sheet.open({
            title: "Attach",
            options: [
              {
                label: "Photo",
                description: "Send a photo (JPG, PNG)",
                icon: "🖼",
              },
              {
                label: "Document",
                description: "Send a file (PDF, DOC)",
                icon: "📄",
              },
            ],
            onSelect: function (opt, idx) {
              if (idx === 0) pickImage();
              else pickFile();
            },
          });
        }

        function pickImage() {
          var labels = [
            "Parking Area",
            "Suspicious Person",
            "Vehicle Issue",
            "Gate View",
            "Basement",
          ];
          var label = labels[Math.floor(Math.random() * labels.length)];
          pendingAttachment = {
            type: "image",
            url: Store.svgImage(label, "#007AFF"),
            name: label.toLowerCase().replace(/\s+/g, "-") + ".jpg",
            size: Math.floor(Math.random() * 400 + 100) + " KB",
          };
          renderAttachmentPreview();
          updateComposerState();
        }

        function pickFile() {
          pendingAttachment = {
            type: "file",
            url: "#",
            name: "security-report.pdf",
            size: "142 KB",
          };
          renderAttachmentPreview();
          updateComposerState();
        }

        /* =================================================
         11. Send message
         ================================================= */
        function sendMessage() {
          var text = msgInput.value.trim();
          var hasText = text.length > 0;
          var hasAttach = !!pendingAttachment;

          if (!hasText && !hasAttach) return;
          if (text.length > LIMITS.MESSAGE_MAX) {
            toast(
              "Message exceeds " + LIMITS.MESSAGE_MAX + " characters",
              "error",
            );
            return;
          }

          /* Create conversation on first send (for ?id=new) */
          if (!conv) {
            conv = Store.createConversation(
              pendingRecipient.guardId,
              pendingRecipient.type,
              pendingRecipient.label,
            );
            convId = conv.id;
            sessionStorage.removeItem("aptivo_mg_pending_recipient");
            history.replaceState(
              null,
              "",
              "chat.html?id=" + encodeURIComponent(convId),
            );
          }

          Store.sendMessage(convId, {
            senderType: "resident",
            senderName: Store.RESIDENT.name,
            text: text,
            attachments: pendingAttachment ? [pendingAttachment] : [],
          });

          /* Clear composer */
          msgInput.value = "";
          msgInput.style.height = "auto";
          pendingAttachment = null;
          renderAttachmentPreview();
          updateComposerState();

          /* Re-render */
          renderHeader();
          renderMessages();
          renderBanner();
          renderRoleSwitch();
          scrollToBottom();

          startStatusPolling();
        }

        /* =================================================
         12. Polling for status updates (sent → delivered)
         ================================================= */
        function snapshotMessages() {
          return JSON.stringify(
            Store.getMessages(convId).map(function (m) {
              return m.id + ":" + m.status;
            }),
          );
        }

        function startStatusPolling() {
          if (statusPollTimer || !conv) return;
          var lastSnapshot = snapshotMessages();
          statusPollTimer = setInterval(function () {
            if (!conv) {
              stopStatusPolling();
              return;
            }
            var messages = Store.getMessages(convId);
            var snapshot = JSON.stringify(
              messages.map(function (m) {
                return m.id + ":" + m.status;
              }),
            );
            var hasPending = messages.some(function (m) {
              return m.senderType === "resident" && m.status === "sent";
            });
            if (snapshot !== lastSnapshot) {
              lastSnapshot = snapshot;
              var stick = isNearBottom();
              renderMessages();
              if (stick) scrollToBottom();
            }
            if (!hasPending) stopStatusPolling();
          }, 800);
        }

        function stopStatusPolling() {
          if (statusPollTimer) {
            clearInterval(statusPollTimer);
            statusPollTimer = null;
          }
        }

        /* =================================================
         13. More menu
         ================================================= */
        function openMoreMenu() {
          if (!conv) {
            toast("Send a message first");
            return;
          }
          var options = [];
          if (conv.recipientType !== "all") {
            options.push({
              label: "Call guard",
              description: "Voice call (demo)",
              icon: "📞",
            });
          }
          if (conv.status === "active") {
            options.push({
              label: "Simulate guard reply",
              description: "Demo — test two-way flow",
              icon: "💬",
            });
          } else {
            options.push({
              label: "Reopen conversation",
              description: "Mark as active",
              icon: "↻",
            });
          }

          Sheet.open({
            title: "Conversation",
            options: options,
            onSelect: function (opt) {
              if (opt.label === "Call guard") {
                toast("Calling guard… (demo)", "info");
              } else if (opt.label === "Simulate guard reply") {
                simulateGuardReply();
              } else if (opt.label === "Reopen conversation") {
                Confirm.show({
                  title: "Reopen conversation?",
                  body: "The conversation will be marked active again so you can continue messaging the guard.",
                  confirmLabel: "Reopen",
                  onConfirm: function () {
                    Store.reopenConversation(convId);
                    conv = Store.getConversation(convId);
                    renderAll();
                    toast("Conversation reopened", "success");
                  },
                });
              }
            },
          });
        }

        function simulateGuardReply() {
          var replies = [
            "Acknowledged, ma'am. I'll check and update you shortly.",
            "On my way to check now.",
            "Thank you for informing. Security is being notified.",
            "I've alerted the other guards. Will keep you posted.",
          ];
          Store.sendMessage(convId, {
            senderType: "guard",
            senderName: conv.guardName,
            text: replies[Math.floor(Math.random() * replies.length)],
            attachments: [],
          });
          renderMessages();
          scrollToBottom();
          toast("Guard replied (demo)", "success", 1800);
        }

        /* =================================================
         14. Full render
         ================================================= */
        function renderAll() {
          renderHeader();
          renderMessages();
          renderBanner();
          renderRoleSwitch();
          scrollToBottom();
        }

        /* =================================================
         15. Event bindings
         ================================================= */
        document
          .getElementById("backBtn")
          .addEventListener("click", function () {
            goBack("list.html");
          });

        msgInput.addEventListener("input", function () {
          msgInput.style.height = "auto";
          msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + "px";
          updateComposerState();
        });

        msgInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            if (!sendBtn.disabled) sendMessage();
          }
        });

        sendBtn.addEventListener("click", sendMessage);
        attachBtn.addEventListener("click", openAttachSheet);
        moreBtn.addEventListener("click", openMoreMenu);

        /* =================================================
         16. Initialise
         ================================================= */
        if (conv) {
          Store.markConversationRead(convId, "resident");
        }
        renderAll();
        updateComposerState();
      });
    </script>
  </body>
</html>
